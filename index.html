<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base81 Encoder and Decoder.</title>
<style>
:root {
  --bg: #0f1115;
  --card: #1a1d24;
  --border: #2a2e38;
  --text: #e6e8ec;
  --muted: #9aa0ab;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --success: #22c55e;
  --danger: #ef4444;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, monospace;
}
[data-theme="light"] {
  --bg: #f4f5f7;
  --card: #ffffff;
  --border: #e2e5eb;
  --text: #1a1d24;
  --muted: #5c6370;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 24px 16px 48px;
  line-height: 1.5;
}
.container { max-width: 860px; margin: 0 auto; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
h1 {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(
    90deg,
    #ff5555,
    #ffaa00,
    #ffff55,
    #55ff55,
    #55ffff,
    #5555ff,
    #ff55ff,
    #ff5555
  );
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rainbow-move 7s linear infinite;
}
@keyframes rainbow-move {
  to { background-position: 200% center; }
}
.theme-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.15rem;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  padding: 0;
  transition: 0.15s;
}
.theme-btn:hover { border-color: var(--accent); }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 20px;
}
.card h2 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
label { font-size: 0.9rem; color: var(--muted); display: block; margin-bottom: 6px; }
select, textarea, input[type="file"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.15s;
}
select:focus, textarea:focus { border-color: var(--accent); }
textarea {
  font-family: var(--mono);
  min-height: 120px;
  resize: vertical;
  line-height: 1.45;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
button {
  border: none;
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 0.92rem;
  font-weight: 500;
  cursor: pointer;
  transition: 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
.btn-danger:hover { border-color: var(--danger); }
.progress-wrap { margin-top: 12px; display: none; }
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar > div {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.2s;
}
.status { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 28px 16px;
  text-align: center;
  color: var(--muted);
  transition: 0.15s;
  cursor: pointer;
}
.drop-zone.dragover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--accent);
}
.drop-zone p { margin-top: 6px; font-size: 0.9rem; }
.file-info { font-size: 0.88rem; color: var(--muted); margin-top: 10px; }
.meta { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 18px;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  opacity: 0;
  transform: translateY(12px);
  transition: 0.25s;
  z-index: 99;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.gc-btn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  color: white;
  font-size: 1.3rem;
  cursor: grab;
  box-shadow: 0 4px 12px rgba(255, 85, 85, 0.4);
  transition: transform 0.2s, box-shadow 0.2s;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  user-select: none;
  isolation: isolate;
  background: linear-gradient(
    90deg,
    #ff5555,
    #ffaa00,
    #ffff55,
    #55ff55,
    #55ffff,
    #5555ff,
    #ff55ff,
    #ff5555
  );
  background-size: 200% auto;
  animation: rainbow-move 10s linear infinite;
}
.gc-btn::before {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: linear-gradient(
    90deg,
    #ff5555,
    #ffaa00,
    #ffff55,
    #55ff55,
    #55ffff,
    #5555ff,
    #ff55ff,
    #ff5555
  );
  background-size: 200% auto;
  animation: rainbow-move 10s linear infinite;
  z-index: -1;
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  mask-composite: exclude;
  padding: 3px;
}
@keyframes rainbow-move {
  to { background-position: 200% center; }
}
.gc-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 16px rgba(255, 85, 85, 0.6);
  cursor: grab;
}
.gc-btn:active {
  cursor: grabbing;
}
.gc-btn.dragging {
  opacity: 0.9;
  box-shadow: 0 8px 20px rgba(255, 85, 85, 0.8);
}
@media (max-width: 600px) {
  .row button { flex: 1; }
  .gc-btn {
    width: 45px;
    height: 45px;
    font-size: 1.1rem;
  }
}
</style>
</head>

    <label style="margin-top:14px">Output.</label>

    <div class="row">

  </div>
  <div class="card">
    <h2>File Mode.</h2>
    <div class="drop-zone" id="dropZone">

      <p>Or click to upload files.</p>
      <input type="file" id="fileInput" hidden>

    <div class="file-info" id="fileInfo"></div>
    <div class="row" style="margin-top:14px">

    </div>
    <div class="progress-wrap" id="fileProgress">
      <div class="progress-bar"><div id="progressBar"></div></div>
      <p class="status" id="fileStatus"></p>
    </div>
  </div>
</div>

        if (name.startsWith('word/')) hasWord = true;
        else if (name.startsWith('xl/')) hasXl = true;
        else if (name.startsWith('ppt/')) hasPpt = true;
        if (hasWord || hasXl || hasPpt) break;
        const compSize = (bytes[pos + 18] | (bytes[pos + 19] << 8) | (bytes[pos + 20] << 16) | (bytes[pos + 21] << 24)) >>> 0;
        pos = nameStart + nameLen + extraLen + compSize;
      } else {
        pos++;
      }
    }
    if (hasWord) return '.docx';
    if (hasXl) return '.xlsx';
    if (hasPpt) return '.pptx';
    return '.zip';
  }
  for (const [offset, sig, ext] of SORTED_SIGNATURES) if (matchBytes(bytes, offset, sig)) return ext;
  return '.bin';
}

const WORKER_CODE = `
const ALPHABET = "0192837465ZaYbXcWdVeUfTgShRiQjPkOlNmMnLoKpJqIrHsGtFuEvDwCxByAz/!?@>#<%.^:;*}({)]+[-\\\\=";
const PAD = "~";
const REVERSE = new Uint8Array(128);
for (let i = 0; i < ALPHABET.length; i++) REVERSE[ALPHABET.charCodeAt(i)] = i;

function encodeBytes(bytes) {
  const n = bytes.length;
  const fullGroups = Math.floor(n / 5);
  const rem = n % 5;
  const totalGroups = fullGroups + (rem > 0 ? 1 : 0);
  const out = new Uint8Array(totalGroups * 7);
  let ci = 0;
  for (let i = 0; i < fullGroups * 5; i += 5) {
    let v = bytes[i] * 4294967296 + bytes[i+1] * 16777216 + bytes[i+2] * 65536 + bytes[i+3] * 256 + bytes[i+4];
    for (let j = 6; j >= 0; j--) {
      out[ci + j] = ALPHABET.charCodeAt(v % 81);
      v = Math.floor(v / 81);
    }
    ci += 7;
  }
  if (rem > 0) {
    let v = 0;
    for (let i = fullGroups * 5; i < n; i++) v = v * 256 + bytes[i];
    const needed = Math.ceil(rem * 8 / Math.log2(81));
    const temp = new Uint8Array(needed);
    for (let k = needed - 1; k >= 0; k--) {
      temp[k] = ALPHABET.charCodeAt(v % 81);
      v = Math.floor(v / 81);
    }
    for (let j = 0; j < 7; j++) out[ci + j] = j < needed ? temp[j] : 126;
  }
  return new TextDecoder().decode(out);
}

function decodeBytes(str, totalBytes) {
  const result = new Uint8Array(totalBytes);
  let ri = 0;
  const groups = Math.floor(str.length / 7);
  for (let g = 0; g < groups; g++) {
    const start = g * 7;
    let v = 0;
    for (let j = 0; j < 7; j++) {
      const c = str[start + j];
      if (c === PAD) break;
      v = v * 81 + REVERSE[c.charCodeAt(0)];
    }
    const isLast = g === groups - 1;
    const bytesInGroup = isLast ? (totalBytes - ri) : 5;
    for (let j = bytesInGroup - 1; j >= 0; j--) {
      result[ri + j] = v & 0xFF;
      v = Math.floor(v / 256);
    }
    ri += bytesInGroup;
  }
  return result;
}

self.onmessage = (e) => {
  const {type, bytes, str, totalBytes} = e.data;
  try {
    if (type === 'encode') {
      const result = encodeBytes(bytes);
      self.postMessage({result});
    } else if (type === 'decode') {
      const result = decodeBytes(str, totalBytes);
      self.postMessage({result}, [result.buffer]);
    }
  } catch(err) {
    self.postMessage({error: err.message});
  }
};
`;

let workerPool = null;
let workerBlobUrl = null;
let gcTimer = null;
let fileBuffer = null;
let currentFileName = "";

function getOptimalWorkers(byteLength) {
  if (byteLength < 65536) return 1;
  if (byteLength < 524288) return Math.min(2, MAX_WORKERS);
  return MAX_WORKERS;
}

function getWorkerPool() {
  if (workerPool) { resetGcTimer(); return workerPool; }
  const blob = new Blob([WORKER_CODE], {type: 'application/javascript'});
  workerBlobUrl = URL.createObjectURL(blob);
  workerPool = Array.from({length: MAX_WORKERS}, () => new Worker(workerBlobUrl));
  resetGcTimer();
  return workerPool;
}

function runWorker(worker, msg, retries = 2) {
  const msgCopy = msg.type === 'encode' && msg.bytes ? {...msg, bytes: msg.bytes.slice()} : msg;
  return new Promise((resolve, reject) => {
    let attempts = 0;
    function attempt() {
      attempts++;
      worker.onmessage = (e) => {
        if (e.data.error) {
          if (attempts <= retries) attempt();
          else reject(new Error(e.data.error));
        } else {
          resolve(e.data.result);
        }
      };
      worker.onerror = (e) => {
        if (attempts <= retries) attempt();
        else reject(new Error(e.message));
      };
      if (msg.type === 'encode' && msgCopy.bytes?.buffer) {
        worker.postMessage({...msgCopy, bytes: msgCopy.bytes.slice()}, [msgCopy.bytes.slice().buffer]);
      } else {
        worker.postMessage(msgCopy);
      }
    }
    attempt();
  });
}

function resetGcTimer() {
  clearTimeout(gcTimer);
  gcTimer = setTimeout(() => {
    if (workerPool) {
      workerPool.forEach(w => w.terminate());
      workerPool = null;
      URL.revokeObjectURL(workerBlobUrl);
      workerBlobUrl = null;
    }
  }, GC_IDLE_MS);
}

function forceGC() {
  if (workerPool) {
    const count = workerPool.length;
    workerPool.forEach(w => w.terminate());
    workerPool = null;
    if (workerBlobUrl) {
      URL.revokeObjectURL(workerBlobUrl);
      workerBlobUrl = null;
    }
    clearTimeout(gcTimer);
    toast(`Cleared ${count} worker${count > 1 ? 's' : ''}.`);
  } else {
    toast('No workers to clear.');
  }
}

function splitBytes(bytes, n) {
  if (bytes.length === 0 || n <= 1) return [bytes];
  const rawSize = Math.ceil(bytes.length / n);
  const size = Math.ceil(rawSize / 5) * 5;
  const chunks = [];
  for (let i = 0; i < bytes.length; i += size) chunks.push(bytes.subarray(i, i + size));
  return chunks;
}

function calculateChecksum(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc ^= bytes[i];
    for (let j = 0; j < 8; j++) {
      crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
    }
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
} // CRC32 is probably the best because this is not encrypter!

async function parallelEncode(bytes, encId) {
  const num = getOptimalWorkers(bytes.length);
  const workers = getWorkerPool();
  const chunks = splitBytes(bytes, num);
  const results = await Promise.all(
    chunks.map((chunk, i) => runWorker(workers[i], {type: 'encode', bytes: chunk}))
  );
  const checksum = calculateChecksum(bytes).toString(16);
  return `${encId},${bytes.length},${checksum}\n` + results.join('\n');
}

async function parallelDecode(text) {
  const lines = text.trim().split('\n');
  const [encId, totalBytes, checksum] = lines[0].split(',');
  const chunks = lines.slice(1).filter(l => l.length > 0);
  const num = getOptimalWorkers(totalBytes);
  const workers = getWorkerPool();
  let bytesAccum = 0;
  const chunkByteCounts = chunks.map((chunk, i) => {
    if (i < chunks.length - 1) {
      const b = (chunk.length / 7) * 5;
      bytesAccum += b;
      return b;
    }
    return totalBytes - bytesAccum;
  });
  const results = await Promise.all(
    chunks.map((chunk, i) => runWorker(workers[i % num], {
      type: 'decode',
      str: chunk,
      totalBytes: chunkByteCounts[i]
    }))
  );
  const out = new Uint8Array(totalBytes);
  let offset = 0;
  for (const r of results) { 
    out.set(r, offset); 
    offset += r.length; 
  }
  const calculatedChecksum = calculateChecksum(out).toString(16);
  if (calculatedChecksum !== checksum) throw new Error(`Checksum mismatch! Expected ${checksum}, got ${calculatedChecksum}`);
  return {bytes: out, encId: parseInt(encId)};
}

function encodeWith1252(text) {
  const arr = [];
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    const byte = WIN1252_ENCODE.get(cp);
    arr.push(byte !== undefined ? byte : 63);
  }
  return new Uint8Array(arr);
}

function decodeWith1252(bytes) {
  return [...bytes].map(b => String.fromCodePoint(WIN1252_DECODE[b])).join('');
}

function encodeWithISO88591(text) {
  const arr = [];
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    arr.push(cp < 256 ? cp : 63);
  }
  return new Uint8Array(arr);
}

function decodeWithISO88591(bytes) {
  return [...bytes].map(b => String.fromCodePoint(b)).join('');
}

function encodeWithISO885915(text) {
  const arr = [];
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    const byte = ISO885915_ENCODE.get(cp);
    arr.push(byte !== undefined ? byte : 63);
  }
  return new Uint8Array(arr);
}

function decodeWithISO885915(bytes) {
  return [...bytes].map(b => String.fromCodePoint(ISO885915_DECODE[b])).join('');
}

function textToBytes(text, enc) {
  switch(enc) {
    case "utf8": return new TextEncoder().encode(text);
    case "utf16le": {
      const buf = new ArrayBuffer(text.length * 2);
      const view = new DataView(buf);
      for (let i = 0; i < text.length; i++) view.setUint16(i * 2, text.charCodeAt(i), true);
      return new Uint8Array(buf);
    }
    case "utf16be": {
      const buf = new ArrayBuffer(text.length * 2);
      const view = new DataView(buf);
      for (let i = 0; i < text.length; i++) view.setUint16(i * 2, text.charCodeAt(i), false);
      return new Uint8Array(buf);
    }
    case "utf32le": {
      const arr = [];
      for (let i = 0; i < text.length; i++) {
        const c = text.charCodeAt(i);
        arr.push(c & 0xFF, (c >> 8) & 0xFF, 0, 0);
      }
      return new Uint8Array(arr);
    }
    case "utf32be": {
      const arr = [];
      for (let i = 0; i < text.length; i++) {
        const c = text.charCodeAt(i);
        arr.push(0, 0, (c >> 8) & 0xFF, c & 0xFF);
      }
      return new Uint8Array(arr);
    }
    case "ascii": return new Uint8Array([...text].map(c => c.charCodeAt(0) & 0x7F));
    case "win1252": return encodeWith1252(text);
    case "iso88591": return encodeWithISO88591(text);
    case "iso885915": return encodeWithISO885915(text);
    default: return new TextEncoder().encode(text);
  }
}

function bytesToText(bytes, enc) {
  switch(enc) {
    case "utf8": return new TextDecoder().decode(bytes);
    case "utf16le": {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
      let s = '';
      for (let i = 0; i + 1 < bytes.length; i += 2) s += String.fromCharCode(view.getUint16(i, true));
      return s;
    }
    case "utf16be": {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
      let s = '';
      for (let i = 0; i + 1 < bytes.length; i += 2) s += String.fromCharCode(view.getUint16(i, false));
      return s;
    }
    case "utf32le": {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
      let t = '';
      for (let i = 0; i + 3 < bytes.length; i += 4) t += String.fromCharCode(view.getUint32(i, true));
      return t;
    }
    case "utf32be": {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
      let t = '';
      for (let i = 0; i + 3 < bytes.length; i += 4) t += String.fromCharCode(view.getUint32(i, false));
      return t;
    }
    case "ascii": return [...bytes].map(b => String.fromCharCode(b & 0x7F)).join('');
    case "win1252": return decodeWith1252(bytes);
    case "iso88591": return decodeWithISO88591(bytes);
    case "iso885915": return decodeWithISO885915(bytes);
    default: return new TextDecoder().decode(bytes);
  }
}

function timestampName(ext) {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${ext}`;
}

function showProgress(wrapId, barId, pct, show) {
  const wrap = document.getElementById(wrapId);
  const bar = document.getElementById(barId);
  wrap.style.display = show ? "block" : "none";
  bar.style.width = pct + "%";
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

function updateInputMeta() {
  const val = document.getElementById("input").value;
  document.getElementById("inputMeta").textContent = val ? `${val.length} characters.` : "";
}

async function encode() {
  const encId = parseInt(document.getElementById("encoding").value);
  const bytes = textToBytes(document.getElementById("input").value, ENCODINGS[encId]);
  showProgress("textProgress", "textProgressBar", 40, true);
  try {
    document.getElementById("output").value = await parallelEncode(bytes, encId);
    document.getElementById("textStatus").textContent = `Encoded ${bytes.length} bytes`;
    showProgress("textProgress", "textProgressBar", 100, true);
    setTimeout(() => showProgress("textProgress", "textProgressBar", 0, false), 600);
  } catch (e) {
    toast("Error: " + e.message);
    showProgress("textProgress", "textProgressBar", 0, false);
  }
}

async function decode() {
  const text = document.getElementById("input").value.trim();
  if (!text) { toast("Nothing to decode."); return; }
  showProgress("textProgress", "textProgressBar", 40, true);
  try {
    const {bytes, encId} = await parallelDecode(text);
    const encName = ENCODINGS[encId];
    document.getElementById("output").value = (!encName || encName === "binary")
      ? "[Binary data detected! Please check input or use File Mode.]"
      : bytesToText(bytes, encName);
    document.getElementById("textStatus").textContent = `Decoded ${bytes.length} bytes`;
    showProgress("textProgress", "textProgressBar", 100, true);
    setTimeout(() => showProgress("textProgress", "textProgressBar", 0, false), 600);
  } catch (e) {
    toast("Error: " + e.message);
    showProgress("textProgress", "textProgressBar", 0, false);
  }
}

function clearText() {
  document.getElementById("input").value = "";
  document.getElementById("output").value = "";
  document.getElementById("inputMeta").textContent = "";
  document.getElementById("textStatus").textContent = "";
}

function copyOutput() {
  const out = document.getElementById("output").value;
  if (!out) { toast("Nothing to copy."); return; }
  navigator.clipboard.writeText(out).then(() => toast("Copied.")).catch(() => toast("Copy failed."));
}

function saveOutputFile() {
  const out = document.getElementById("output").value;
  if (!out) { toast("Nothing to save."); return; }
  const a = Object.assign(document.createElement("a"), {
    href: URL.createObjectURL(new Blob([out])),
    download: timestampName(".base81")
  });
  a.click();
}

function handleFileSelect(file) {
  if (!file) return;
  currentFileName = file.name;
  document.getElementById("fileInfo").textContent = `${file.name} (${formatFileSize(file.size)}).`;
  document.getElementById("downloadBtn").style.display = "none";
}

async function encodeFile() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) { toast("Please select a file to encode!"); return; }
  const bytes = new Uint8Array(await file.arrayBuffer());
  showProgress("fileProgress", "progressBar", 40, true);
  document.getElementById("downloadBtn").style.display = "none";
  try {
    fileBuffer = await parallelEncode(bytes, 5);
    document.getElementById("fileStatus").textContent = `Encoded: ${file.name} (${bytes.length} bytes)`;
    document.getElementById("downloadBtn").dataset.ext = ".base81";
    document.getElementById("downloadBtn").style.display = "inline-block";
    showProgress("fileProgress", "progressBar", 100, true);
    setTimeout(() => showProgress("fileProgress", "progressBar", 0, false), 600);
  } catch (e) {
    toast("Error: " + e.message);
    showProgress("fileProgress", "progressBar", 0, false);
  }
}

async function decodeFile() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) { toast("Please select a file to decode!"); return; }
  showProgress("fileProgress", "progressBar", 40, true);
  document.getElementById("downloadBtn").style.display = "none";
  try {
    const {bytes} = await parallelDecode(new TextDecoder().decode(await file.arrayBuffer()));
    fileBuffer = bytes;
    const ext = detectFileType(bytes);
    document.getElementById("fileStatus").textContent = `Decoded: ${file.name} (${bytes.length} bytes) → ${ext}`;
    document.getElementById("downloadBtn").dataset.ext = ext;
    document.getElementById("downloadBtn").style.display = "inline-block";
    showProgress("fileProgress", "progressBar", 100, true);
    setTimeout(() => showProgress("fileProgress", "progressBar", 0, false), 600);
  } catch (e) {
    toast("Error: " + e.message);
    showProgress("fileProgress", "progressBar", 0, false);
  }
}

function formatFileSize(bytes) {
  if (bytes === 0) return "0 B";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
}

function downloadFile() {
  if (!fileBuffer) { toast("No data to download!"); return; }
  const ext = document.getElementById("downloadBtn").dataset.ext || ".bin";
  const a = Object.assign(document.createElement("a"), {
    href: URL.createObjectURL(new Blob([fileBuffer])),
    download: timestampName(ext)
  });
  a.click();
}

async function loadSampleJpg() {
  const sampleText = SAMPLE_JPG_BASE81;
  showProgress("fileProgress", "progressBar", 30, true);
  document.getElementById("downloadBtn").style.display = "none";
  document.getElementById("fileInfo").textContent = "sample.jpg (encoded) – 609 B.";
  try {
    const { bytes } = await parallelDecode(sampleText);
    fileBuffer = bytes;
    const ext = detectFileType(bytes);
    document.getElementById("fileStatus").textContent = `Decoded sample: ${bytes.length} bytes (${ext})`;
    document.getElementById("downloadBtn").dataset.ext = ext;
    document.getElementById("downloadBtn").style.display = "inline-block";
    showProgress("fileProgress", "progressBar", 100, true);
    setTimeout(() => showProgress("fileProgress", "progressBar", 0, false), 600);
    if (confirm("Decode sample finished (.jpg).\nWould you like to download it?")) {
      downloadFile();
    }
  } catch (e) {
    toast("Error: " + e.message);
    showProgress("fileProgress", "progressBar", 0, false);
  }
}

document.getElementById("input").addEventListener("input", updateInputMeta);
document.getElementById("input").addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "Enter") encode();
});

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    handleFileSelect(e.dataTransfer.files[0]);
  }
});

fileInput.addEventListener("change", () => handleFileSelect(fileInput.files[0]));
document.getElementById("themeBtn").addEventListener("click", () => {
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "light" ? "" : "light";
  html.setAttribute("data-theme", next);
  document.getElementById("themeBtn").textContent = next === "light" ? "☀" : "☾";
});

document.getElementById("gcBtn").addEventListener("click", forceGC);

let isDraggingGC = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

const gcBtn = document.getElementById("gcBtn");

gcBtn.addEventListener("mousedown", (e) => {
  isDraggingGC = true;
  gcBtn.classList.add("dragging");
  const rect = gcBtn.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  gcBtn.style.cursor = "grabbing";
  gcBtn.style.transition = "none";
});

document.addEventListener("mousemove", (e) => {
  if (!isDraggingGC) return;
  const x = e.clientX - dragOffsetX;
  const y = e.clientY - dragOffsetY;
  gcBtn.style.bottom = "auto";
  gcBtn.style.right = "auto";
  gcBtn.style.left = x + "px";
  gcBtn.style.top = y + "px";
});

document.addEventListener("mouseup", () => {
  if (isDraggingGC) {
    isDraggingGC = false;
    gcBtn.classList.remove("dragging");
    gcBtn.style.cursor = "grab";
    gcBtn.style.transition = "0.2s";
  }
});
</script>
</body>
