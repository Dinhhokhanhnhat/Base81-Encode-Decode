<!-- Only good for light files. -->
<!-- Still in alpha. -->
<!-- You can download this and adjust as your wish. -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base81 Encoder and Decoder.</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Base81 by Lykke Månestrand.</h1>
    <button class="theme-btn" id="themeBtn" title="Change display mode.">☀</button>
  </header>
  <div class="card">
    <h2>Text Mode.</h2>
    <label>Encoding.</label>
    <select id="encoding">
      <option value="1">UTF-8.</option>
      <option value="2">ASCII.</option>
      <option value="3">UTF-16 LE.</option>
      <option value="4">UTF-32 LE.</option>
      <option value="6">UTF-16 BE.</option>
      <option value="7">UTF-32 BE.</option>
      <option value="8">Windows-1252.</option>
      <option value="9">ISO-8859-1.</option>
      <option value="10">ISO-8859-15.</option>
    </select>
    <label style="margin-top:14px">Input.</label>
    <textarea id="input" placeholder="Enter plaintext...">Base81 Encoder and Decoder by Lykke Månestrand.</textarea>
    <div class="meta" id="inputMeta"></div>
    <div class="row">
      <button class="btn-primary" onclick="encode()">Encode.</button>
      <button class="btn-secondary" onclick="decode()">Decode.</button>
      <button class="btn-danger" onclick="clearText()">Clear.</button>
    </div>
    <div class="progress-wrap" id="textProgress">
      <div class="progress-bar"><div id="textProgressBar"></div></div>
      <p class="status" id="textStatus"></p>
    </div>
    <label style="margin-top:14px">Output.</label>
    <textarea id="output" readonly></textarea>
    <div class="row">
      <button class="btn-secondary" onclick="copyOutput()">Copy.</button>
      <button class="btn-secondary" onclick="saveOutputFile()">Save as .base81 format.</button>
    </div>
  </div>
  <div class="card">
    <h2>File Mode.</h2>
    <div class="drop-zone" id="dropZone">
      <strong>Drag and drop your files here.</strong>
      <p>Or click to upload files.</p>
      <input type="file" id="fileInput" hidden>
    </div>
    <div class="file-info" id="fileInfo"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn-primary" onclick="encodeFile()">Encode File.</button>
      <button class="btn-secondary" onclick="decodeFile()">Decode File.</button>
      <button class="btn-secondary" onclick="loadSampleJpg()">Test sample JPG.</button>
      <button class="btn-secondary" id="downloadBtn" style="display:none" onclick="downloadFile()">Download.</button>
    </div>
    <div class="progress-wrap" id="fileProgress">
      <div class="progress-bar"><div id="progressBar"></div></div>
      <p class="status" id="fileStatus"></p>
    </div>
  </div>
</div>
<button class="gc-btn" id="gcBtn" title="Force garbage collection & clear workers.">🗑</button>
<div class="toast" id="toast"></div>
<script type="module" src="main_script.js"></script>
</body>
</html>
